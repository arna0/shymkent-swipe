name: CI
on: [push, pull_request]
jobs:
  server-and-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Swipe is saved to SQLite and survives a restart
        env:
          NODE_ENV: production
          DB_FILE: /tmp/ci.db
        run: |
          USER=usr-shym-002
          node dist/server.cjs > /tmp/s1.log 2>&1 & PID=$!
          for i in $(seq 1 30); do curl -sf localhost:3000/api/health > /dev/null && break; sleep 1; done
          curl -s -X POST localhost:3000/api/feed/reset -H 'Content-Type: application/json' -d "{\"userId\":\"$USER\"}"; echo
          PROBLEM=$(curl -s localhost:3000/api/problems | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);const list=Array.isArray(j)?j:(j.data||j.problems);console.log(list[0].id)})')
          echo "problem: $PROBLEM"
          first=$(curl -s -o /tmp/first.json -w '%{http_code}' -X POST localhost:3000/api/swipe -H 'Content-Type: application/json' \
            -d "{\"userId\":\"$USER\",\"problemId\":\"$PROBLEM\",\"swipeType\":\"RIGHT_IMPORTANT\"}")
          echo "first swipe -> $first"; cat /tmp/first.json; echo
          kill $PID; sleep 1
          node dist/server.cjs > /tmp/s2.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:3000/api/health > /dev/null && break; sleep 1; done
          second=$(curl -s -o /tmp/second.json -w '%{http_code}' -X POST localhost:3000/api/swipe -H 'Content-Type: application/json' \
            -d "{\"userId\":\"$USER\",\"problemId\":\"$PROBLEM\",\"swipeType\":\"RIGHT_IMPORTANT\"}")
          echo "same swipe after restart -> $second (409 = the first one was saved)"; cat /tmp/second.json; echo
          echo "--- server logs"; cat /tmp/s1.log /tmp/s2.log
          test "$first" = 200 && test "$second" = 409
